<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apologia Pages</title>
    <link rel="icon" href="https://raw.githubusercontent.com/TheGigabyteKid/Apologia/refs/heads/main/favicon.webp" type="image/webp">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 700;
            color: #111827;
        }

        .projects-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .project {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .project:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            color: #1f2937;
        }

        .project-creator {
            font-size: 1rem;
            color: #6b7280;
            margin: 0;
        }

        .project-button {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            align-self: flex-start;
            margin-top: 0.75rem;
            transition: background-color 0.2s ease;
        }

        .project-button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <h1>Projects</h1>

    <div class="projects-container">

        <!-- PROJECT 1 -->
        <div class="project">
            <h2 class="project-title">Place</h2>
            <p class="project-creator">The Gigabyte Kid</p>
            <a href="https://tpusa.com" target="_blank" rel="noopener noreferrer" class="project-button">Open</a>
        </div>

        <!-- PROJECT 2 -->
        <div class="project">
            <h2 class="project-title">Place</h2>
            <p class="project-creator">The Gigabyte Kid</p>
            <a href="https://tpusa.com" target="_blank" rel="noopener noreferrer" class="project-button">Open</a>
        </div>

        <!-- PROJECT 3 -->
        <div class="project">
            <h2 class="project-title">Place</h2>
            <p class="project-creator">The Gigabyte Kid</p>
            <a href="https://tpusa.com" target="_blank" rel="noopener noreferrer" class="project-button">Open</a>
        </div>

    </div>

</body>
</html>
